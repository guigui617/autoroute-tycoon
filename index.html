<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoroute Tycoon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }

        header {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 150px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        select, input {
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 10px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .ticker {
            background-color: #0284c7;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🛣️ Autoroute Tycoon</h1>
        <div id="ticker" class="ticker">Chargement de la concession...</div>
        
        <div class="stats-bar">
            <div class="stat-card">
                <div>Trésorerie</div>
                <div class="stat-value" id="budget">- €</div>
            </div>
            <div class="stat-card">
                <div>Tarif péage/km</div>
                <div class="stat-value" id="toll-rate">- €</div>
            </div>
            <div class="stat-card">
                <div>Satisfaction</div>
                <div class="stat-value" id="satisfaction">-%</div>
            </div>
            <div class="stat-card">
                <button onclick="triggerGameTick()">⏩ Passer un mois</button>
            </div>
        </div>
    </header>

    <div class="grid-2">
        <div class="card">
            <h2>🏗️ Construire une Autoroute</h2>
            <div>
                <label>Ville de départ</label>
                <select id="city-a"></select>
                <label>Ville d'arrivée</label>
                <select id="city-b"></select>
                <button onclick="buildHighway()">Lancer le chantier</button>
            </div>

            <h3 style="margin-top:20px;">Réseau sous concession</h3>
            <div id="highways-list" class="item-list"></div>
        </div>

        <div class="card">
            <h2>🚜 Flotte & Interventions</h2>
            <h3>Acheter du matériel</h3>
            <div id="fleet-catalog" class="item-list"></div>

            <h3 style="margin-top:20px;">Flotte actuelle</h3>
            <div id="fleet-player" class="item-list"></div>
        </div>
    </div>
</div>

<script>
    // CONFIGURATION SUPABASE
    const SUPABASE_URL = 'https://bqyodcxwbjpucpmudkmn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_8h4cupw2ZGpslNlJ4BZ7Rg_UtPH5CPc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        loadGameState();
        loadCities();
        loadHighways();
        loadFleet();
    });

    async function loadGameState() {
        const { data, error } = await supabaseClient.from('game_state').select('*').eq('id', 1).single();
        if (error) return console.error(error);

        document.getElementById('budget').innerText = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(data.budget);
        document.getElementById('toll-rate').innerText = `${data.toll_rate} €`;
        document.getElementById('satisfaction').innerText = `${data.satisfaction} %`;
        document.getElementById('ticker').innerText = data.ticker_message;
    }

    async function loadCities() {
        const { data, error } = await supabaseClient.from('cities').select('*').order('name');
        if (error) return console.error(error);

        const selectA = document.getElementById('city-a');
        const selectB = document.getElementById('city-b');
        selectA.innerHTML = ''; selectB.innerHTML = '';

        data.forEach(city => {
            selectA.add(new Option(city.name, city.name));
            selectB.add(new Option(city.name, city.name));
        });
    }

    async function loadHighways() {
        const { data, error } = await supabaseClient.from('highways').select('*');
        if (error) return console.error(error);

        const container = document.getElementById('highways-list');
        container.innerHTML = '';

        data.forEach(hw => {
            container.innerHTML += `
                <div class="item-row">
                    <div>
                        <strong>${hw.name}</strong><br>
                        <small style="color:var(--text-muted)">${hw.distance_km} km | Trafic: ${hw.traffic} véh/j</small>
                    </div>
                </div>
            `;
        });
    }

    async function loadFleet() {
        const { data: catalog } = await supabaseClient.from('fleet_catalog').select('*');
        const { data: player } = await supabaseClient.from('fleet_player').select('*');

        const catalogContainer = document.getElementById('fleet-catalog');
        const playerContainer = document.getElementById('fleet-player');
        
        catalogContainer.innerHTML = '';
        playerContainer.innerHTML = '';

        catalog.forEach(item => {
            const price = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(item.price);
            catalogContainer.innerHTML += `
                <div class="item-row">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color:var(--text-muted)">${price}</small>
                    </div>
                    <button onclick="buyVehicle('${item.vehicle_key}')">Acheter</button>
                </div>
            `;
        });

        player.forEach(item => {
            const vehicleInfo = catalog.find(c => c.vehicle_key === item.vehicle_key);
            if (item.count > 0) {
                playerContainer.innerHTML += `
                    <div class="item-row">
                        <div><strong>${vehicleInfo ? vehicleInfo.name : item.vehicle_key}</strong></div>
                        <span style="font-weight:bold; color:var(--accent);">${item.count}</span>
                    </div>
                `;
            }
        });
    }

    async function buildHighway() {
        const cityA = document.getElementById('city-a').value;
        const cityB = document.getElementById('city-b').value;

        if (cityA === cityB) {
            alert("Veuillez choisir deux villes différentes.");
            return;
        }

        const { data, error } = await supabaseClient.rpc('create_highway', { p_city_a: cityA, p_city_b: cityB });
        if (error) return alert("Erreur lors de la construction.");
        
        alert(data.message);
        loadGameState();
        loadHighways();
    }

    async function buyVehicle(key) {
        const { data, error } = await supabaseClient.rpc('buy_vehicle', { p_vehicle_key: key });
        if (error) return alert("Erreur d'achat.");

        alert(data.message);
        loadGameState();
        loadFleet();
    }

    async function triggerGameTick() {
        const { data, error } = await supabaseClient.rpc('process_game_tick');
        if (error) return alert("Erreur de simulation.");

        const income = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(data.net_balance);
        alert(`Bilan du mois : ${income}`);
        loadGameState();
    }
</script>

</body>
</html>
